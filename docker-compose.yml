# QuickServe full stack: MongoDB + API + Admin web.
#   docker compose up --build
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      NODE_ENV: production
      CLIENT_ORIGIN: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      JWT_EXPIRES_IN: 7d
      MONGODB_URI: mongodb://mongo:27017/quickserve

  web:
    build:
      context: .
      # NEXT_PUBLIC_* must be baked at build time into the client bundle.
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-to-a-long-random-string}
      # Server-side (NextAuth route) reaches the API over the compose network.
      API_URL: http://api:4000

volumes:
  mongo-data:
